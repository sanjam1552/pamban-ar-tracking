<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>New Pamban Bridge 3D Experience | RVNL</title>
  
  <!-- Font Imports -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Import Google model-viewer component -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=33">
</head>
<body>
  <!-- Header HUD -->
  <header class="hud-header">
    <div class="logo-container-compact">
      <span class="rvnl-tag">RVNL</span>
      <span class="ar-tag">3D INTERACTIVE</span>
    </div>
    <div class="title-container">
      <h3>NEW PAMBAN BRIDGE</h3>
      <p>India's First Vertical Lift Sea Bridge</p>
    </div>
  </header>

  <!-- 3D Studio & AR Viewer -->
  <model-viewer
    id="bridge-viewer"
    src="assets/pamban_bridge_standard.glb"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    shadow-intensity="1"
    environment-image="neutral"
    exposure="1.2"
    interaction-prompt="auto"
    camera-orbit="45deg 75deg 2.5m"
    min-camera-orbit="auto auto 0.5m"
    max-camera-orbit="auto auto 10m"
    touch-action="none">

    <!-- Pulsing Hotspots on the 3D Model -->
    <button class="hotspot-pin" slot="hotspot-lift" data-position="0 0.05 0.05" data-normal="0 0 1" data-title="Scherzer Vertical Lift Span" data-desc="A 72.5m rolling lift span that raises vertically to allow ships and vessels to navigate the sea channel below.">
      <div class="hotspot-pulse"></div>
    </button>

    <button class="hotspot-pin" slot="hotspot-piers" data-position="-0.4 0 0.02" data-normal="0 0 1" data-title="Marine Substructure" data-desc="Consists of concrete piers designed with marine-grade materials to withstand the high-salinity environment of the Palk Strait.">
      <div class="hotspot-pulse"></div>
    </button>

    <button class="hotspot-pin" slot="hotspot-length" data-position="0.4 0 0.02" data-normal="0 0 1" data-title="2.07 km Sea Approach" data-desc="Connecting Rameswaram Island to mainland India via 143 steel girder spans, standing as a marvel of railway marine engineering.">
      <div class="hotspot-pulse"></div>
    </button>

    <!-- Custom AR Launch Button -->
    <button slot="ar-button" id="ar-trigger-btn">
      🚀 VIEW IN YOUR ROOM (AR)
    </button>
  </model-viewer>

  <!-- Hotspot Details Modal -->
  <div id="hotspot-modal" class="hidden">
    <div class="modal-content">
      <button id="modal-close-btn">&times;</button>
      <div class="modal-header">
        <span class="badge">SPECIFICATION</span>
        <h4 id="modal-title">Hotspot Details</h4>
      </div>
      <p id="modal-desc">Details about this section of the Pamban Bridge will appear here.</p>
    </div>
  </div>

  <!-- Swipe Instruction Toast -->
  <div id="instruction-toast" class="toast">
    Drag to rotate | Pinch to zoom | Tap points for specs
  </div>

  <script type="module" src="js/app.js?v=33"></script>
</body>
</html>
